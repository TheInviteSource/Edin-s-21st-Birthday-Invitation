<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edin's 21st Birthday</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

body{
  margin:0;
  background:#18110d;
  font-family:Georgia,serif;
  overscroll-behavior:none
}

.page{
  min-height:100svh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:max(12px,env(safe-area-inset-top))
          max(12px,env(safe-area-inset-right))
          max(12px,env(safe-area-inset-bottom))
          max(12px,env(safe-area-inset-left));
  background:radial-gradient(circle,#6b4b3299,transparent 43%),#1c130e
}

.invite{
  position:relative;
  width:min(100%,600px);
  height:min(calc(100svh - 24px),800px);
  height:min(calc(100dvh - 24px),800px);
  aspect-ratio:3/4;
  overflow:hidden;
  background:#1b120e;
  box-shadow:0 18px 55px #000;
  border:1px solid #8c6949;
  border-radius:3px
}

.frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity .7s ease;
  filter:contrast(1.02) saturate(.9)
}

.frame:first-child,
.frame.show{
  opacity:1
}


/* =========================
   FLOWERS
   ========================= */

.flowers{
  position:absolute;
  z-index:5;
  inset:0;
  pointer-events:none
}

.bloom{
  position:absolute;
  opacity:0;
  filter:drop-shadow(0 4px 6px #170c0a99);
}


/* LEFT OUTER FLOWERS */
.bf1{
  width:38%;
  height:28%;
  left:-4%;
  bottom:-2%;
  background:url('flowers-left.png') center bottom / contain no-repeat;
  --d:.1s
}


/* RIGHT OUTER FLOWERS */
.bf2{
  width:38%;
  height:28%;
  right:-4%;
  bottom:-2%;
  background:url('flowers-right.png') center bottom / contain no-repeat;
  --d:.32s
}


/* LEFT INNER FLOWERS */
.bf3{
  width:30%;
  height:23%;
  left:17%;
  bottom:-2%;
  background:url('flowers-left.png') center bottom / contain no-repeat;
  --d:.55s
}


/* RIGHT INNER FLOWERS */
.bf4{
  width:30%;
  height:23%;
  right:17%;
  bottom:-2%;
  background:url('flowers-right.png') center bottom / contain no-repeat;
  --d:.78s
}


/* FLOWER ANIMATION */
.done .bloom{
  animation:bloom .9s cubic-bezier(.17,.88,.28,1.35) var(--d) forwards
}

@keyframes bloom{
  0%{
    opacity:0;
    transform:scale(.05) rotate(-18deg)
  }

  65%{
    opacity:1;
    transform:scale(1.13) rotate(7deg)
  }

  100%{
    opacity:1;
    transform:scale(1)
  }
}

@keyframes rose{
  0%{
    opacity:0;
    transform:translateX(-50%) scale(.05) rotate(-35deg)
  }

  70%{
    opacity:1;
    transform:translateX(-50%) scale(1.15) rotate(6deg)
  }

  100%{
    opacity:1;
    transform:translateX(-50%) scale(1)
  }
}


/* =========================
   BUTTON
   ========================= */

.control{
  position:absolute;
  z-index:10;
  left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  min-height:44px;
  padding:12px 20px;
  color:#fff6e3;
  background:#1d1612e8;
  border:1px solid #c5a371;
  border-radius:2px;
  font:600 clamp(9px,2.5vw,11px) Georgia,serif;
  letter-spacing:1.7px;
  text-transform:uppercase;
  white-space:nowrap;
  cursor:pointer;
  touch-action:manipulation
}


/* =========================
   HINT
   ========================= */

.hint{
  position:absolute;
  z-index:9;
  left:8%;
  right:8%;
  bottom:82px;
  text-align:center;
  color:#fffaeb;
  text-shadow:0 2px 4px #000;
  font-size:clamp(9px,2.8vw,11px);
  letter-spacing:1.7px;
  text-transform:uppercase;
  transition:opacity .4s
}

.open .hint{
  opacity:0
}


/* =========================
   SMALL PHONES
   ========================= */

@media(max-width:380px){

  .page{
    padding:0
  }

  .invite{
    width:100vw;
    height:100svh;
    height:100dvh;
    border:0;
    border-radius:0
  }

  .control{
    bottom:max(13px,env(safe-area-inset-bottom));
    padding:10px 14px
  }

  .hint{
    bottom:70px
  }

  /* Slightly smaller flowers on very small screens */
  .bf1,
  .bf2{
    width:40%;
    height:27%
  }

  .bf3,
  .bf4{
    width:31%;
    height:22%
  }
}


/* =========================
   LANDSCAPE
   ========================= */

@media(orientation:landscape) and (max-height:600px){

  .page{
    padding:0
  }

  .invite{
    height:100svh;
    height:100dvh;
    width:min(76vh,600px)
  }

  .control{
    bottom:10px
  }

  .hint{
    bottom:61px
  }
}
</style>
</head>

<body>

<main class="page">

<section class="invite" id="invite" aria-label="Edin's 21st birthday invitation">

  <!-- GATE FRAMES -->
  <img class="frame show"
       src="gate-frame-1.jpg"
       alt="Closed wrought-iron garden gates">

  <img class="frame"
       src="gate-frame-2.jpg"
       alt="">

  <img class="frame"
       src="gate-frame-3.jpg"
       alt="">

  <img class="frame"
       src="gate-frame-4.jpg"
       alt="">

  <img class="frame"
       src="gate-frame-5.jpg"
       alt="">

  <img class="frame"
       src="gate-frame-6.jpg"
       alt="Edin's 21st birthday invitation">


  <!-- FLOWERS -->
  <div class="flowers">

    <i class="bloom bf1"></i>

    <i class="bloom bf2"></i>

    <i class="bloom bf3"></i>

    <i class="bloom bf4"></i>

  </div>


  <!-- HINT -->
  <p class="hint">
    Tap to open the garden gates
  </p>


  <!-- BUTTON -->
  <button class="control" id="control">
    Open the garden gates
  </button>

</section>


<!-- MUSIC -->
<audio id="music" preload="auto">
  <source src="la-vie-en-rose.mp3" type="audio/mpeg">
</audio>

</main>


<script>

const i = document.getElementById('invite');
const b = document.getElementById('control');
const m = document.getElementById('music');

const f = [...document.querySelectorAll('.frame')];

let waits = [];


function clear(){
  waits.forEach(clearTimeout);
  waits = [];
}


function reset(){

  clear();

  f.forEach((x,n) =>
    x.classList.toggle('show',n === 0)
  );

  i.classList.remove('open','done');

  b.textContent = 'Open the garden gates';

  m.pause();
  m.currentTime = 0;
}


b.onclick = () => {

  if(i.classList.contains('open')){
    return reset();
  }

  i.classList.add('open');

  b.textContent = 'Close the garden gates';

  m.currentTime = 0;

  m.play().catch(() => {});


  [850,1700,2550,3600,6000].forEach((t,n) => {

    waits.push(
      setTimeout(() => {

        f[n].classList.remove('show');

        f[n+1].classList.add('show');


        if(n === 4){
          i.classList.add('done');
        }

      },t)
    );

  });

};

</script>

</body>
</html>
