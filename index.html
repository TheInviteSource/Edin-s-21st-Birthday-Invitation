<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Edin's 21st Birthday</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#18110d;font-family:Georgia,serif}.page{min-height:100dvh;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top));background:#1b120e}.invite{position:relative;width:min(100vw - 20px,600px);height:min(97dvh,800px);aspect-ratio:3/4;overflow:hidden;background:#1b120e;box-shadow:0 18px 55px #000;border:1px solid #8c6949}.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease}.frame:first-child,.show{opacity:1}.flowers{position:absolute;z-index:5;inset:0;pointer-events:none}.cluster{position:absolute;opacity:0;background-image:url('flowers-sprite.png');background-repeat:no-repeat;background-size:610px auto;filter:drop-shadow(0 4px 6px #170c0a99);transform:scale(.05);transform-origin:bottom}.left-big{width:205px;height:170px;left:-16px;bottom:-8px;background-position:-5px -267px;--d:.1s}.right-big{width:205px;height:170px;right:-20px;bottom:-8px;background-position:-405px -267px;--d:.3s}.left-small{width:155px;height:142px;left:19%;bottom:-13px;background-position:-140px -267px;--d:.5s}.right-small{width:155px;height:142px;right:19%;bottom:-13px;background-position:-270px -267px;--d:.7s}.rose{width:170px;height:163px;left:50%;bottom:-22px;background-position:-335px 0;transform:translateX(-50%) scale(.05) rotate(-25deg);transform-origin:center bottom;--d:.95s}.done .cluster:not(.rose){animation:pop .9s cubic-bezier(.17,.88,.28,1.35) var(--d) forwards}.done .rose{animation:rose 1.1s cubic-bezier(.17,.88,.28,1.35) var(--d) forwards}@keyframes pop{0%{opacity:0;transform:scale(.05) rotate(-14deg)}60%{opacity:1;transform:scale(1.14) rotate(6deg)}100%{opacity:1;transform:scale(1)}}@keyframes rose{0%{opacity:0;transform:translateX(-50%) scale(.05) rotate(-25deg)}65%{opacity:1;transform:translateX(-50%) scale(1.14) rotate(6deg)}100%{opacity:1;transform:translateX(-50%) scale(1)}}.control{position:absolute;z-index:10;left:50%;bottom:max(17px,env(safe-area-inset-bottom));transform:translateX(-50%);min-height:44px;padding:12px 18px;color:#fff6e3;background:#1d1612e8;border:1px solid #c5a371;font:600 clamp(9px,2.5vw,11px) Georgia;letter-spacing:1.6px;text-transform:uppercase;white-space:nowrap;cursor:pointer}.hint{position:absolute;z-index:9;left:0;right:0;bottom:79px;text-align:center;color:#fffaeb;text-shadow:0 2px 4px #000;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;transition:.3s}.open .hint{opacity:0}@media(max-width:430px){.page{padding:0}.invite{width:100vw;height:100dvh;border:0}.cluster{background-size:530px auto}.left-big{width:170px;height:142px;background-position:-4px -232px}.right-big{width:170px;height:142px;background-position:-350px -232px}.left-small{width:130px;height:119px;background-position:-122px -232px}.right-small{width:130px;height:119px;background-position:-234px -232px}.rose{width:144px;height:138px;background-position:-292px 0}.control{bottom:max(11px,env(safe-area-inset-bottom))}}@media(orientation:landscape) and (max-height:600px){.page{padding:0}.invite{height:100dvh;width:min(76vh,600px)}.control{bottom:9px}.hint{bottom:62px}}
</style></head><body><main class="page"><section class="invite" id="invite"><img class="frame show" src="gate-frame-1.jpg" alt="Closed wrought-iron garden gates"><img class="frame" src="gate-frame-2.jpg" alt=""><img class="frame" src="gate-frame-3.jpg" alt=""><img class="frame" src="gate-frame-4.jpg" alt=""><img class="frame" src="gate-frame-5.jpg" alt=""><img class="frame" src="gate-frame-6.jpg" alt="Edin's 21st birthday invitation"><div class="flowers"><i class="cluster left-big"></i><i class="cluster right-big"></i><i class="cluster left-small"></i><i class="cluster right-small"></i><i class="cluster rose"></i></div><p class="hint">Tap to open the garden gates</p><button class="control" id="control">Open the garden gates</button></section><audio id="music"><source src="la-vie-en-rose.mp3" type="audio/mpeg"></audio></main><script>const i=document.getElementById('invite'),b=document.getElementById('control'),m=document.getElementById('music'),f=[...document.querySelectorAll('.frame')];let w=[];function reset(){w.forEach(clearTimeout);w=[];f.forEach((x,n)=>x.classList.toggle('show',!n));i.classList.remove('open','done');b.textContent='Open the garden gates';m.pause();m.currentTime=0}b.onclick=()=>{if(i.classList.contains('open'))return reset();i.classList.add('open');b.textContent='Close the garden gates';m.play().catch(()=>{});[850,1700,2550,3600,6000].forEach((t,n)=>w.push(setTimeout(()=>{f[n].classList.remove('show');f[n+1].classList.add('show');if(n===4)i.classList.add('done')},t)))}</script></body></html>
